; Multiplayer Overhaul settings - Layout 2 (1.0.3)
; Change these on the Lightloader Mod settings page, or in this file. Restart the game after a change.
; Every player needs the mod. Older settings files are upgraded on game start; your values are kept.

[Mod]
; Turn Multiplayer Overhaul on or off. Off = the normal game, no CO-OP entry in the main menu. (1 = on)
Enabled=1

[Prototype]
; Host: the AI cars join once this many players are in the game, host included. Default: just the host.
PlayersBeforeBots=1
; Client: how many players you expect in the game, host included. Default: two.
ExpectedPlayers=2

[CoOp]
; Client only: the host's IP address, for when the host is not found automatically (Tailscale, VPN or internet).
; Leave empty on a home network. Several addresses can be separated by commas.
HostAddress=
; Network port for the AI field and season files (UDP and TCP). Same number on every PC.
; The host must allow it in the firewall, or forward it on the router for internet games. Default: 34500.
ManifestPort=34500
; Host only: press Ctrl+T on the garage monitor to speed up time. Stops when you drive. Clients are not sped up. (1 = on)
HostTimeWarp=1
; How fast the Ctrl+T time warp runs, from 2 to 30 times normal speed. Default: 10. Faster can make AI cars unstable.
HostTimeWarpSpeed=10
; Qualifying: AI cars without a lap time go out first from 30% of the session, so every AI car sets a time. (1 = on)
EveryBotSetsQualiTime=1
; Practice and qualifying: AI cars drive slow out and in laps, and push from about 300 m before the line. Experimental. (1 = on)
BotSlowOutAndInLaps=0
; Throttle limit on those slow laps, from 50 to 100 percent. Default: 75.
SlowLapThrottle=75
; When a player leaves mid-session, an AI driver takes the car back at once. Off = at the next session, which avoids a freeze. (1 = on)
BotTakesOverAtOnce=0
; Pit Stop Failures mod: every PC shows the same pit stop failure. (1 = on)
SharePitStopFailures=1
; Mechanical Failures mod: every PC shows the same engine failures. Not tested in a real race yet. (1 = on)
ShareMechanicalFailures=0

[Log]
; Very detailed log for bug reports. Turn it on for every player before the session you report (Readme section 7). (1 = on)
DetailedLog=0
; Largest log file size in MB. Default: 20. When full, the older part moves to coop_mode_log.old.txt.
LogSizeLimitMB=20

[Menu]
; Filled in by the game: remembers if you last picked CO-OP in the main menu. No need to change it.
LastSelected=
