; ESC Pause Menu — edit with the game closed.

[Mod]
; 1 = use the pause menu, 0 = keep the original ESC behavior.
Enabled=1

; --- Advanced settings ---
[Retire]
; Maximum wait for Retire to pits, in milliseconds (100-5000).
HoldMaxMs=900
; Block restart requests this long after retiring (500-10000 ms).
GuardMs=2500

[Multiplayer]
; 1 = in multiplayer, ESC opens the menu without pausing (online games cannot
; pause). 0 = keep the original ESC online. Needs Lightloader 2.3.3 or newer.
MenuWithoutPause=1
