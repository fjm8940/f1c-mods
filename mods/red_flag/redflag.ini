; Red Flag — edit with the game closed. Safe defaults apply to invalid values.
; Times ending in Ms are milliseconds. Details and corrections go to RedFlag.log.

[Activation]
; 1 = detect serious incidents automatically; 0 = manual-only when enabled below.
AutomaticEnabled=1
; 1 = allow manual Red Flags with RedFlagKey.
ManualEnabled=1
; Activation key. Reserved/conflicting keys fall back to T.
RedFlagKey=T
; 1 = allow cancellation before pit orders; 0 = never cancel.
AllowCancellation=0
; 1 = raise a Red Flag for a verified Safety Car fault.
SafetyCarFaultRedFlag=1
; 1 = allow Red Flag after sustained extreme wetness under Safety Car.
PersistentWeatherRedFlag=1
; 1 = require the game's yellow flag before automatic activation.
RequireNativeYellow=1
; 1 = ask for RedFlagKey confirmation of automatic incidents.
RequireManualRedFlagAcceptance=1
; Minimum race length percentage for automatic activation (0-100).
MinimumRaceDistancePercent=25

[Restart]
; Maximum wetness for automatic restart after WeatherResumeSeconds (0-0.95).
WeatherResumeWetness=0.90
; 1 = allow two RedFlagKey presses to override the weather wait.
AllowWeatherRestartOverride=1
; PostRedFlag = latest RF checkpoint; FullRace = original qualifying grid.
YRestartMode=PostRedFlag
; Countdown or DriveToPits.
RestartProcedure=Countdown

[Replay]
; 1 = save each Red Flag segment as a separate replay.
SplitOnRedFlagRestart=1

; --- Advanced settings ---

[Timing]
; Active-time delay after confirmation; pause freezes it. Optional cancellation follows AllowCancellation. Range 1-120.
ManualActivationCountdownSeconds=10
; Active-time limit for an unanswered automatic RF offer. Range 5-120.
AcceptanceTimeoutSeconds=30
; Continuous improved wetness before a weather RF may restart. Active seconds, pause excluded; range 5-600.
WeatherResumeSeconds=30
; Active seconds to obtain verified SC return; expiry holds RF with session-restart fault, never steals ownership. Range 15-600.
SafetyCarHandoffTimeoutSeconds=60
; Continuous extreme wetness during SC before RF. Range 15-600; pause does not count.
PersistentWeatherSeconds=60
; Seconds after stable green before another automatic Red Flag is allowed. Higher means fewer Red Flags. Range: 10-3600.
CooldownSeconds=120
; Length of the visible RACE RESTART IN countdown after the race stops. Range: 5-120 seconds.
RestartCountdownSeconds=15
; Seconds after the race becomes active during which opening-incident settings apply. 0 disables this window. Range: 0-600.
OpeningWindowSeconds=30
; Maximum time gap for damaged cars to be grouped as one incident. Higher combines events across more time. Range: 1-120 seconds.
IncidentFreshnessSeconds=10
; Normal time F1C's yellow flag must remain active before an incident can qualify. 1000 ms = 1 second. Range: 500-60000.
YellowConfirmMs=3000
; Yellow-flag confirmation time used during OpeningWindowSeconds. Range: 500-60000 ms.
OpeningYellowConfirmMs=1000
; Yellow confirmation used for an already-valid incident at WetAssistThreshold. Rain alone never triggers. Range: 500-60000 ms.
WetYellowConfirmMs=2000
; Time a destroyed car must remain confirmed before counting in an incident. Higher rejects brief glitches. Range: 500-60000 ms.
TerminalConfirmMs=4000
; Time a damaged car must stay below StationarySpeedMps before counting as stationary damaged. Range: 500-60000 ms.
StationaryConfirmMs=3000
; Time a severely damaged car must stay below SlowDamagedSpeedMps before its slow-damage state is accepted. Range: 250-60000 ms.
SlowDamageConfirmMs=1000
; Terminal/stationary confirmation time used during the opening window. Range: 500-60000 ms.
OpeningIncidentConfirmMs=2000
; Time a qualifying wreck must continuously block the racing line before triggering. Range: 500-60000 ms.
BlockedCorridorConfirmMs=3000
; Time a car must remain clearly upside down before it can qualify. Range: 1000-60000 ms.
InvertedCarConfirmMs=2500
; Final time every normal trigger condition must remain true after an incident qualifies. Range: 500-60000 ms.
FinalConfirmMs=1000
; Final confirmation time used at or above WetAssistThreshold. Range: 500-60000 ms.
WetFinalConfirmMs=750
; Final confirmation time used at or above StrongWetThreshold. Range: 500-60000 ms.
StrongWetFinalConfirmMs=500
; Time the HUD shows incident reasons/details before RACE STOPPED. No seconds calculation is shown. Range: 1-120.
PreStopNoticeSeconds=10

[Locality]
; Normal maximum distance for grouping recent damaged cars as one diagnostic incident. Range: 5-5000 metres.
ClusterRadiusMeters=300.0
; Incident-grouping distance used only during OpeningWindowSeconds. Range: 5-5000 metres.
OpeningClusterRadiusMeters=200.0
; Maximum separation between terminal cars in an on-track pileup trigger. Smaller requires a tighter pileup. Range: 5-100 metres.
OnTrackPileupRadiusMeters=40.0

[Classification]
; Cars below this speed may count as stationary after confirmation. 1.0 m/s = 3.6 km/h. Range: 0-20 m/s.
StationarySpeedMps=0.5
; Severely damaged cars below this speed enter the slow-damage category; this alone cannot trigger. Range: 0.1-100 m/s.
SlowDamagedSpeedMps=8.0
; Maximum speed for an active severely damaged racing-line blocker. Lower requires it closer to stopped. Range: 0.1-1.0 m/s.
RacingLineStationarySpeedMps=1.0
; Speed tolerance for harmless movement of a destroyed wheel-loss wreck; never applies to recoverable cars. Range: 1.0-5.0 m/s.
TerminalRacingLineJitterSpeedMps=3.0
; Extra width used when deciding whether a car body overlaps the racing line. Higher is more sensitive. Range: 0-0.75 metres.
RacingLineOverlapMarginMeters=0.5
; Required rollover angle: -1.0 is fully upside down and 0.0 is on its side. Nearer -1 requires clearer inversion. Range: -0.95 to 0.0.
InvertedUpDotMax=-0.25

[Weather]
; Wetness level enabling wet confirmation timings for an already-valid incident. 0.90 = 90% wet. These incident timings do not themselves trigger on rain; PersistentWeatherRedFlag is separate. Range: 0-1.
WetAssistThreshold=0.90
; Wetness level enabling strong-wet timing/passive pattern. It cannot be below WetAssistThreshold. Range: 0-1.
StrongWetThreshold=0.96

[Patterns]
; 1 allows a destroyed/overturned/severely damaged stationary racing-line blocker to trigger; 0 disables this trigger.
EnableBlockedCorridor=1
; 1 allows a confirmed upside-down racing-line blocker to qualify even if F1C calls it undamaged; 0 disables it.
EnableInvertedRacingLineBlocker=1
; 1 allows a close pileup of terminal cars on the main-track road to trigger; 0 disables it. Grass/gravel pileups do not qualify.
EnableMultiTerminal=1
; Number of close terminal cars required for the on-track pileup trigger. Minimum: 1; maximum is the current field size.
MultiTerminalCars=2
; 1 logs a mixed terminal/stationary-damaged incident below Red Flag level; 0 ignores this passive pattern. It never changes the race.
EnableMixedBlockage=1
; Terminal cars required by the passive mixed pattern. Minimum: 1.
MixedTerminalCars=1
; Stationary damaged cars required by the passive mixed pattern. Minimum: 1.
MixedStationaryDamagedCars=2
; 1 logs the reduced strong-wet incident below Red Flag level; 0 ignores this passive pattern. It never changes the race.
EnableStrongWetPattern=1
; Terminal cars required by the passive strong-wet pattern. Minimum: 1.
StrongWetTerminalCars=1
; Stationary damaged cars required by the passive strong-wet pattern. Minimum: 1.
StrongWetStationaryDamagedCars=1
; Minimum total cars retained in a diagnostic incident cluster. Minimum: 1.
MinimumClusterCars=2
; Minimum terminal cars retained in a diagnostic incident cluster. Minimum: 1.
MinimumClusterTerminals=1

[Placeholder]
; 1 logs serious below-threshold incidents; 0 stays silent. This never deploys a Safety Car or changes the race.
LogNonRedFlagIncidents=1

[Removal]
; Normal wreck retention in seconds; also inherited by Safety Car while RF owns timers. Range: 1-600.
VehicleRemovalSeconds=60
; Normal debris retention. Range: 1-600 seconds.
DebrisRemovalSeconds=60
; Normal detached-parts retention. Range: 1-600 seconds. RF restart cleanup temporarily uses zero for all three.
PartsDurationSeconds=60
