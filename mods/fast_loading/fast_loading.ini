; fast_loading.ini - Fast Loading settings
; Change a value with Notepad, save the file, then restart the game.
; A missing or wrong value uses the default shown in its comment.

[fastload]
; 1 = Fast Loading on, 0 = off (the game loads the normal way).
Enabled=1
; How many CPU cores help with loading. 0 = automatic (all cores but one).
Threads=0
; 1 = keep a copy of the car scene files, so later loads read them faster.
ScnCache=1
; 1 = faster reading of text data while loading cars and tracks.
FastGets=1
; 1 = faster unpacking of compressed files.
FastInflate=1
; 1 = skip the slow CPU speed test at start-up (saves about 0.2 s).
FastCpuCheck=1
; Optional, uses disk space. 1 = keep converted textures on disk so later loads are faster.
TexCache=0
; Optional, uses disk space. 1 = keep generated texture levels on disk.
MipCache=0
; Optional, uses disk space. 1 = keep decoded images on disk.
FileCache=0
; Largest size of the texture cache in MB (1 to 3072). When it is full, it is emptied at the next game start.
CacheMaxMB=1024
