; Pit Stop Failures 1.1.1 - edit with the game closed.
; For chances above 10%, use incident_chance_override_percent below.
; Lightloader: Show advanced settings exposes this unrestricted text field.
; Applies to eligible player and AI stops only. Unsupported/no-work visits
; are still excluded. Invalid edits are refused and logged as a whole.
; Upgrade keeps your existing INI: copy optional keys below into its existing
; [PitFailures] section. Show advanced settings edits keys present here.

[PitFailures]
; Incident chance per eligible stop: 0.00-100.00%. Default 7.50%.
; Zero disables incidents; 100 selects one at every eligible stop with a
; positive-weight eligible failure type. No extra work is added to no-work stops.
incident_chance_percent = 7.50

; Optional override: inherit uses the main chance above; a number from zero
; to 100.00 overrides it. Use 100.00 here for guaranteed eligible incidents.
; This remains effective when an older manager clamps its main chance control.
incident_chance_override_percent = inherit

; Failure types: relative weights 0-100, not independent percentages.
; Zero disables a type; keep at least one positive. Eligible types are
; renormalized: fuel faults need refuelling, wheel faults need tyre work.
slow_wheel = 60
wheel_gun = 17
fuel_rig = 17
engine_stall = 4
cross_thread = 2

; Subtype weights: 0-100, conditional on their parent failure above.
; Keep at least one positive in EACH group, including disabled parents.
; Set one subtype to 100 and its siblings to zero to select only that subtype.

; Slow wheel change: small delay / awkward wheel change.
slow_wheel_minor = 85
slow_wheel_awkward = 15

; Wheel gun: quick recovery / backup gun / irreparable wheel problem (DNF).
wheel_gun_quick = 80
wheel_gun_backup = 19
wheel_gun_irreparable = 1

; Fuel rig: slow pumping / delayed start / interrupted flow / spill-short fill.
fuel_slow_flow = 65
fuel_delayed_flow = 20
fuel_interrupted_flow = 10
fuel_spill = 5

; Engine stall: straightforward restart / difficult restart.
stall_straightforward = 85
stall_difficult = 15

; Cross-threaded wheel nut: corrected / lengthy recovery / stuck wheel (DNF).
cross_thread_corrected = 70
cross_thread_lengthy = 26
cross_thread_irreparable = 4

; Extra fire complication on fuel incidents only: 0.00-100.00%.
; Independent of fuel subtype. Needs supported runtime fire capability;
; otherwise the original fuel fault remains without fire. Default 5.00%.
fuel_fire_chance_percent = 5.00
