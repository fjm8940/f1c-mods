; Safety Car v0.10.46 - place safetycar.ini beside safetycar.dll in plugins\lightloader.
; Read once at DLL startup. Restart game after edits. GUI overrides are session-only.
; Invalid/out-of-range values use defaults; ; and # inline comments accepted.
; Default U deploy/recall; I emergency reset. Both require two fresh presses with the game focused.
; Keys: one letter or decimal Windows virtual-key code48..255.
; T (84), codes97..99, and identical bindings are rejected; invalid bindings revert BOTH keys to U/I.
; This file applies to every supported track; pit/grid positions are determined by the game.
[sc]
MaximumStintLaps=5 ; Each deployment gets a fresh limit; request return on final circuit, even if incidents remain.
; Block ALL new SC activations at or below this race distance percentage.
; Default10 blocks 5% and10%. Range0..100; 0 disables this distance rule.
RaceDistanceCutoffPercent=10
; Recall defaults to readiness; fixed lap quotas are optional.
; Seconds after SC ends for identified routine retirements; range 0..300. New danger stays eligible.
RetirementCooldownSeconds=30
; Continuous pack/order/clearance readiness; range 1..30 seconds.
RecallReadySeconds=5
; Warning before native pit-return request; range 3..60 seconds.
RecallWarningSeconds=15
; Minimum straight-line distance from XPITIN when requesting return; range 100..1000 m.
RecallEntryMarginMeters=200
; 0 returns when ready; 1 additionally requires the configured caution lap quota.
RecallUseFixedLaps=0
; Log a prolonged readiness hold after this duration; never force GREEN. Range 30..1800 seconds.
RecallWatchdogSeconds=300

; Standalone vehicle removal seconds; active RF owns its own value.
; Standalone vehicle removal delay, seconds. Compatible active Red Flag owns the effective timer. Range 1..600.
VehicleRemovalSeconds=60
; Settle incident order, then restore accidental overtakes.
; Seconds before initially locking a settled queue. Range 3..120.
OrderSettleSeconds=15
; Continuous quiet seconds required to lock the queue. Range 1..30.
OrderQuietSeconds=3
; Seconds below OrderStoppedSpeed before stopped-car exclusion. Range 1..15.
OrderStoppedSeconds=3
; Seconds above OrderRecoverSpeed before a recovered car rejoins order control. Range 1..15.
OrderRecoverSeconds=3
; Stopped-car threshold, m/s. Range 0.1..3.
OrderStoppedSpeed=2
; Recovery threshold, m/s. Range 4..15.
OrderRecoverSpeed=5

