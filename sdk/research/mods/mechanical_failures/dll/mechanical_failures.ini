; Mechanical Failures - player settings
; Keep this file next to mechanical_failures.dll. Restart the game after editing.
; 1 = on, 0 = off.
;
; How often things break follows the game's own option:
;   Options > Realism > Mechanical Failures (none / normal / time-scaled).
; "none" turns every mod failure and warning off, for you and the AI.

[Engine]
; AI cars get engine problems too (smoke, slowing down, retiring),
; about as often as in the normal game.
AIFailures=1

; Missed downshifts and hitting the limiter too hard can hurt the engine.
OverRevDamage=1

; Small harmless issues now and then (a short misfire, a false dash warning, a puff of smoke).
MinorIssues=1

[Sound]
; Mod sound effects (backfire pops, engine blow-up, steam).
; 100 = default, 0 = off, up to 200 = louder.
; The engineer's voice follows the game's Announcer volume instead.
EffectsVolume=100

; New engineer radio lines for engine problems.
; 0 = use the game's own (fewer, more generic) engineer lines instead.
EngineerVoice=1

; Engineer radio line loudness on top of the game's Announcer volume.
; 100 = default, 0 = off, up to 200 = louder.
VoiceVolume=100
