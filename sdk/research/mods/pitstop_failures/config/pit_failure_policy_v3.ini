; pit_failure_policy_v3.ini — two-stage pit-failure preset ().
;
; Versioned development extension of the accepted v2 policy. The accepted
; v2 module and schema_version 2 are unchanged; this file is schema_version 3
; and is only read by v3-capable tools (simulator, offline bridge, tests).
; See docs/TWO_STAGE_TUNING_HANDOFF_2026-09-22.md and docs/POLICY_V2.md.
;
; Model: ONE Bernoulli incident gate per eligible committed service
; (incident_chance_bp, allowed 500..1000 = 5..10%), then an unbiased
; categorical draw over the ELIGIBLE parent incidents (ineligible parents are
; removed first and the rest renormalized), then one frozen severity /
; resolution draw per selected parent. Contextual modifiers are deliberately
; absent in this first implementation: no wet/late/positioning bonuses, no
; pity timers, no reputation risk, no AI/player difference.
;
; Units: *_bp keys are BASIS POINTS (10000 bp = 100%, 1 bp = 0.01%).
; Duration keys are triangular(min, mode, max) TOTAL extra affected-job
; seconds (not per attempt). Relative *_weight keys are unitless ordering.
; Unknown keys, duplicate keys/sections, malformed numbers, unordered
; durations and out-of-range values are fatal: no partial configuration and
; no silent fallback.
;
; Default (Standard) preset: 750 bp gate (7.5%). Calm = 500, Dramatic = 1000;
; the simulator --preset option overrides only incident_chance_bp in memory.

[general]
schema_version = 3
; 500..1000 basis points. One draw per eligible committed service.
incident_chance_bp = 750

[parents]
; Relative parent weights. Remove ineligible parents BEFORE the category draw
; and renormalize the remainder; removed mass never moves to clean.
slow_wheel_weight = 60
wheelgun_weight = 17
fuel_rig_weight = 17
stall_weight = 4
cross_thread_weight = 2

[slow_wheel]
minor_weight = 85
awkward_weight = 15
minor_min = 0.8
minor_mode = 1.5
minor_max = 3
awkward_min = 3
awkward_mode = 4
awkward_max = 6

[wheelgun]
quick_weight = 80
backup_weight = 19
irreparable_weight = 1
quick_min = 3
quick_mode = 5
quick_max = 8
backup_min = 8
backup_mode = 12
backup_max = 20
irreparable_min = 12
irreparable_mode = 18
irreparable_max = 30

[fuel_rig]
slow_flow_weight = 65
temporary_no_flow_weight = 20
interrupted_flow_weight = 10
spill_weight = 5
slow_flow_min = 3
slow_flow_mode = 5
slow_flow_max = 9
temporary_no_flow_min = 6
temporary_no_flow_mode = 9
temporary_no_flow_max = 16
interrupted_flow_min = 4
interrupted_flow_mode = 7
interrupted_flow_max = 12
spill_min = 3
spill_mode = 5
spill_max = 10
; Independent conditional fire-complication selection ON FUEL INCIDENTS ONLY
; (500 bp = 5% of fuel incidents). Recoverable; no fire DNF in this version.
; Select the ordinary fuel subtype first; fire never rerolls it. If the
; runtime effect is unsupported the leaf is suppressed to the frozen ordinary
; fuel fault and reported, never rerolled.
fire_chance_bp = 500
fire_burn_min = 4
fire_burn_mode = 7
fire_burn_max = 12
fire_inspection_min = 2
fire_inspection_mode = 4
fire_inspection_max = 7

[stall]
straightforward_weight = 85
difficult_weight = 15
straightforward_min = 2
straightforward_mode = 3
straightforward_max = 5
difficult_min = 5
difficult_mode = 8
difficult_max = 15

[cross_thread]
corrected_weight = 70
lengthy_weight = 26
irreparable_weight = 4
corrected_min = 6
corrected_mode = 10
corrected_max = 15
lengthy_min = 15
lengthy_mode = 22
lengthy_max = 35
irreparable_min = 12
irreparable_mode = 18
irreparable_max = 30

[corner]
; Relative corner weights for the affected wheel (FL/FR/RL/RR).
fl_weight = 25
fr_weight = 25
rl_weight = 25
rr_weight = 25
