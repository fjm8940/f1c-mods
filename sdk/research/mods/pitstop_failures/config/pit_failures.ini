; pit_failures.ini — tuning for pit_commentary.dll
; Read once at DLL load. Reload = unload-signal + re-inject, no rebuild.
; Delete this file (or any single key) to fall back to the built-in defaults.

; ---------------------------------------------------------------------------
; Probabilities are PER MILLE of ONE draw per pit stop, evaluated as cumulative
; buckets in the order listed. Anything not claimed by a bucket is a clean stop.
; Total below = 114/1000 = 11.4% failure, 0.4% race-ending.
; Keep the sum under 1000.
; ---------------------------------------------------------------------------
[probability]
slow_corner  = 40
wheelgun     = 25
fuel         = 20
stall        = 15
crossthread  = 10
jam_terminal = 4

; Which corner, once a corner failure is picked. Relative weights, any scale.
; Fronts are marginally more exposed than rears in practice.
[corner]
fl = 28
fr = 28
rl = 22
rr = 22

; ---------------------------------------------------------------------------
; Durations are triangular(min, mode, max), sampled per stop. Most stops land
; near mode; the tail out to max is what makes a rare disaster stop memorable.
; Seconds.
; ---------------------------------------------------------------------------
[duration]
slow_corner_min  = 1.0
slow_corner_mode = 2.0
slow_corner_max  = 4.5

wheelgun_min     = 4.0
wheelgun_mode    = 7.0
wheelgun_max     = 14.0

crossthread_min  = 10.0
crossthread_mode = 15.0
crossthread_max  = 25.0

stall_min        = 2.5
stall_mode       = 4.5
stall_max        = 9.0

fuel_slow_min    = 6.0
fuel_slow_mode   = 10.0
fuel_slow_max    = 18.0

fuel_none_min    = 5.0
fuel_none_mode   = 8.0
fuel_none_max    = 15.0

fuel_cut_min     = 4.0
fuel_cut_mode    = 7.0
fuel_cut_max     = 12.0

; seconds from fuel ramp appearing to detecting a slow- or no-flow problem.
; the game's ramp starts when the fuel job activates (PitStopProgress).
; kept short because total service is only ~10s. increase if detection fires
; before the fuel crew even reaches the car.
fuel_ramp_delay  = 1.0

; extra time when a fuel hose failure does not clear on the first attempt
fuel_reattempt_min  = 4.0
fuel_reattempt_mode = 6.0
fuel_reattempt_max  = 12.0

; box-pinned time between the retire call and the actual DNF
jam_dnf_min      = 6.0
jam_dnf_mode     = 8.0
jam_dnf_max      = 12.0

; extra time added when a recoverable failure does not clear first try
reattempt_min    = 3.0
reattempt_mode   = 5.0
reattempt_max    = 9.0

; gap between gun clips on a corner that will not bite
gun_repeat_min   = 2.5
gun_repeat_mode  = 3.5
gun_repeat_max   = 5.0

; Each wheelguns_N.wav is already a COMPLETE gun sequence (BRRT BRRT), so one
; clip = one corner's whole job. Only a FAILING corner plays again, spaced by
; gun_repeat and hard-capped by gun_max_repeats.
[audio]
gun_max_repeats = 3

[recovery]
; chance a recoverable failure clears on each attempt (percent)
recover_pct      = 85
; chance a fuel hose problem recovers on each attempt (percent)
fuel_recover_pct = 80
; chance a cross-thread that has already resisted twice turns terminal (percent)
escalate_pct     = 20
; extra seconds for rear corners — harder to get at
rear_penalty = 0.5
