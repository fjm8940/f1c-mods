; F1 Challenge Red Flag - automatic activation configuration
; Place this file beside the Red Flag DLL. Values are read once when the game
; loads the plug-in; restart the game after editing. Missing or invalid values
; use the defaults shown here. Out-of-range and mutually inconsistent values
; are clamped to safe effective values and written to RedFlag.log. Times ending
; in Ms are milliseconds. Car counts have no fixed mod limit; the live field
; and available process memory are the bounds.
; Every setting is explained on the same line after a semicolon. The mod safely
; ignores that explanation when reading the value.
;
; Terms used below:
; - Terminal car: a destroyed car that cannot realistically continue, such as
;   a wheel-loss wreck. It is not merely a healthy car that has stalled.
; - Stationary damaged car: a damaged car moving below the configured
;   StationarySpeedMps limit for long enough to be confirmed.
; - Active racing line: the dry/wet driving line from the current track's AIW.
; - Passive pattern: written to RedFlag.log for diagnosis, but takes no action.

[Activation]
AutomaticEnabled=1 ; 1 enables incident detection; 0 disables automatic detection and its acceptance prompts. For manual-only control use 0 with ManualEnabled=1.
ManualEnabled=0 ; 1 enables independent initiation: RedFlagKey opens a prompt and a second press commits RF. Unconfirmed prompts expire after 15 active seconds.
RedFlagKey=T ; Letter or decimal Windows VK code. Y and effective SC controls are reserved; conflicts fall back to T and are logged.
AllowCancellation=0 ; 1 permits RedFlagKey cancellation only during the announcement/SC handoff, before pit orders. 0 disables cancellation. Parking/restart phases cannot be cancelled.
SafetyCarFaultRedFlag=1 ; Independent default-on RF for an authenticated SC fault; still requires safe physical SC handoff.
PersistentWeatherRedFlag=1 ; Independent RF for continuously extreme wetness while Safety Car owns race control.
RequireNativeYellow=1 ; 1 requires F1C's yellow flag before a Red Flag; 0 skips only that requirement, not the severe-incident checks.
RequireManualRedFlagAcceptance=0 ; 1 requires RedFlagKey acceptance of a current incident offer. Once accepted, the RF remains committed; unanswered offers expire.
MinimumRaceDistancePercent=25 ; Automatic Red Flag is disabled below this race-distance percentage. 25 blocks 5%, 10% and 20% races while allowing 25%-100%; 0 disables this distance gate. Range: 0-100.

[Timing]
ManualActivationCountdownSeconds=10 ; Active-time delay after confirmation; pause freezes it. Optional cancellation follows AllowCancellation. Range 1-120.
AcceptanceTimeoutSeconds=30 ; Active-time limit for an unanswered automatic RF offer. Range 5-120.
WeatherResumeSeconds=30 ; Continuous improved wetness before a weather RF may restart. Active seconds, pause excluded; range 5-600.
SafetyCarHandoffTimeoutSeconds=60 ; Active seconds to obtain verified SC return; expiry holds RF with session-restart fault, never steals ownership. Range 15-600.
PersistentWeatherSeconds=60 ; Continuous extreme wetness during SC before RF. Range 15-600; pause does not count.
CooldownSeconds=120 ; Seconds after stable green before another automatic Red Flag is allowed. Higher means fewer Red Flags. Range: 10-3600.
RestartCountdownSeconds=15 ; Length of the visible RACE RESTART IN countdown after the race stops. Range: 5-120 seconds.
OpeningWindowSeconds=30 ; Seconds after the race becomes active during which opening-incident settings apply. 0 disables this window. Range: 0-600.
IncidentFreshnessSeconds=10 ; Maximum time gap for damaged cars to be grouped as one incident. Higher combines events across more time. Range: 1-120 seconds.
YellowConfirmMs=3000 ; Normal time F1C's yellow flag must remain active before an incident can qualify. 1000 ms = 1 second. Range: 500-60000.
OpeningYellowConfirmMs=1000 ; Yellow-flag confirmation time used during OpeningWindowSeconds. Range: 500-60000 ms.
WetYellowConfirmMs=2000 ; Yellow confirmation used for an already-valid incident at WetAssistThreshold. Rain alone never triggers. Range: 500-60000 ms.
TerminalConfirmMs=4000 ; Time a destroyed car must remain confirmed before counting in an incident. Higher rejects brief glitches. Range: 500-60000 ms.
StationaryConfirmMs=3000 ; Time a damaged car must stay below StationarySpeedMps before counting as stationary damaged. Range: 500-60000 ms.
SlowDamageConfirmMs=1000 ; Time a severely damaged car must stay below SlowDamagedSpeedMps before its slow-damage state is accepted. Range: 250-60000 ms.
OpeningIncidentConfirmMs=2000 ; Terminal/stationary confirmation time used during the opening window. Range: 500-60000 ms.
BlockedCorridorConfirmMs=3000 ; Time a qualifying wreck must continuously block the racing line before triggering. Range: 500-60000 ms.
InvertedCarConfirmMs=2500 ; Time a car must remain clearly upside down before it can qualify. Range: 1000-60000 ms.
FinalConfirmMs=1000 ; Final time every normal trigger condition must remain true after an incident qualifies. Range: 500-60000 ms.
WetFinalConfirmMs=750 ; Final confirmation time used at or above WetAssistThreshold. Range: 500-60000 ms.
StrongWetFinalConfirmMs=500 ; Final confirmation time used at or above StrongWetThreshold. Range: 500-60000 ms.
PreStopNoticeSeconds=10 ; Time the HUD shows incident reasons/details before RACE STOPPED. No seconds calculation is shown. Range: 1-120.

[Locality]
ClusterRadiusMeters=300.0 ; Normal maximum distance for grouping recent damaged cars as one diagnostic incident. Range: 5-5000 metres.
OpeningClusterRadiusMeters=200.0 ; Incident-grouping distance used only during OpeningWindowSeconds. Range: 5-5000 metres.
OnTrackPileupRadiusMeters=40.0 ; Maximum separation between terminal cars in an on-track pileup trigger. Smaller requires a tighter pileup. Range: 5-100 metres.

[Classification]
StationarySpeedMps=0.5 ; Cars below this speed may count as stationary after confirmation. 1.0 m/s = 3.6 km/h. Range: 0-20 m/s.
SlowDamagedSpeedMps=8.0 ; Severely damaged cars below this speed enter the slow-damage category; this alone cannot trigger. Range: 0.1-100 m/s.
RacingLineStationarySpeedMps=1.0 ; Maximum speed for an active severely damaged racing-line blocker. Lower requires it closer to stopped. Range: 0.1-1.0 m/s.
TerminalRacingLineJitterSpeedMps=3.0 ; Speed tolerance for harmless movement of a destroyed wheel-loss wreck; never applies to recoverable cars. Range: 1.0-5.0 m/s.
RacingLineOverlapMarginMeters=0.5 ; Extra width used when deciding whether a car body overlaps the racing line. Higher is more sensitive. Range: 0-0.75 metres.
InvertedUpDotMax=-0.25 ; Required rollover angle: -1.0 is fully upside down and 0.0 is on its side. Nearer -1 requires clearer inversion. Range: -0.95 to 0.0.

[Weather]
WetAssistThreshold=0.90 ; Wetness level enabling wet confirmation timings for an already-valid incident. 0.90 = 90% wet. These incident timings do not themselves trigger on rain; PersistentWeatherRedFlag is separate. Range: 0-1.
StrongWetThreshold=0.96 ; Wetness level enabling strong-wet timing/passive pattern. It cannot be below WetAssistThreshold. Range: 0-1.

[Patterns]
EnableBlockedCorridor=1 ; 1 allows a destroyed/overturned/severely damaged stationary racing-line blocker to trigger; 0 disables this trigger.
EnableInvertedRacingLineBlocker=1 ; 1 allows a confirmed upside-down racing-line blocker to qualify even if F1C calls it undamaged; 0 disables it.
EnableMultiTerminal=1 ; 1 allows a close pileup of terminal cars on the main-track road to trigger; 0 disables it. Grass/gravel pileups do not qualify.
MultiTerminalCars=2 ; Number of close terminal cars required for the on-track pileup trigger. Minimum: 1; maximum is the current field size.
EnableMixedBlockage=1 ; 1 logs a mixed terminal/stationary-damaged incident below Red Flag level; 0 ignores this passive pattern. It never changes the race.
MixedTerminalCars=1 ; Terminal cars required by the passive mixed pattern. Minimum: 1.
MixedStationaryDamagedCars=2 ; Stationary damaged cars required by the passive mixed pattern. Minimum: 1.
EnableStrongWetPattern=1 ; 1 logs the reduced strong-wet incident below Red Flag level; 0 ignores this passive pattern. It never changes the race.
StrongWetTerminalCars=1 ; Terminal cars required by the passive strong-wet pattern. Minimum: 1.
StrongWetStationaryDamagedCars=1 ; Stationary damaged cars required by the passive strong-wet pattern. Minimum: 1.
MinimumClusterCars=2 ; Minimum total cars retained in a diagnostic incident cluster. Minimum: 1.
MinimumClusterTerminals=1 ; Minimum terminal cars retained in a diagnostic incident cluster. Minimum: 1.

[Placeholder]
LogNonRedFlagIncidents=1 ; 1 logs serious below-threshold incidents; 0 stays silent. This never deploys a Safety Car or changes the race.

[Restart]
WeatherResumeWetness=0.90 ; Maximum path wetness allowing automatic restart after weather RF; must remain below this for WeatherResumeSeconds. Range 0-0.95.
AllowWeatherRestartOverride=1 ; 1 permits two explicit RedFlagKey presses at the weather wait to restart despite weather; all other readiness checks remain. 0 requires weather improvement.
YRestartMode=PostRedFlag ; PostRedFlag returns to the latest completed Red Flag restart checkpoint (grid, laps, fuel and retirees), not the state when Y is pressed. FullRace restores the original qualifying grid and lets vanilla reset laps and retirees. Before any Red Flag, Y is vanilla.
RestartProcedure=Countdown ; Countdown uses RestartCountdownSeconds. DriveToPits waits for all survivors; after player arrival, a 60-second escape requires every missing car to be positively healthy. After five active minutes the key explicitly selects Countdown. Terminal/DQ players are refused pending native continuation proof.

; Red Flag adds no fuel: each survivor retains fuel measured immediately before
; restart, including consumption while returning to the pits. Legacy Refuel
; settings are ignored. Y checkpoint replay retains its checkpoint fuel.

[Replay]
SplitOnRedFlagRestart=1 ; 1 saves each Red Flag restart as Part 1, Part 2, etc. without overwriting older files; 0 keeps normal single-replay behavior.

[Removal]
VehicleRemovalSeconds=60 ; Normal wreck retention in seconds; also inherited by Safety Car while RF owns timers. Range: 1-600.
DebrisRemovalSeconds=60 ; Normal debris retention. Range: 1-600 seconds.
PartsDurationSeconds=60 ; Normal detached-parts retention. Range: 1-600 seconds. RF restart cleanup temporarily uses zero for all three.
