; adaptive_ai_difficulty.ini - development build.
; Enabled is read once at load (1 = patch the strength call; 0 = vanilla, nothing patched).
; Factors are polled every 2 s and applied live from the game thread.
; Factors are clamped to 0.80..1.20. Slot 0 and the player car are always passed through.
; RatingLog (0.2.0-dev, read once at load): 1 = rate the player's clean race laps vs the AI teammate (log-only, the
;   AI is NOT changed). Works with Enabled=0. Output: adaptive_ai_difficulty_rating.jsonl + _ratings.json beside the DLL.
; RatingTrace: 1 = also write every sample to %TEMP%\aad_trace_<utc>_pid<n>.txt (replay test fixture, ~6 MB/hour).
; RatingIntervalMs: sample interval, default 500 (100..2000).
; Adaptive (0.3.0-dev, read once): 1 = the weekend decision sets the AI level (needs Enabled=1); 0 = decisions are
;   only logged. Session report: adaptive_ai_difficulty_last_session.txt beside the DLL.
; ProxyDriver (0.3.1-dev TEST, read once): an AI driver name (e.g. Human Driver) rated INSTEAD of the player; that AI
;   car is never scaled, so the rest of the field adapts to it. Empty/absent = off (the player is rated).
[Adaptive]
Enabled=0
AllAIFactor=1.000
RatingLog=1
RatingTrace=1
RatingIntervalMs=500
Adaptive=0
; ProxyDriver=Human Driver
; Slot5=1.050
