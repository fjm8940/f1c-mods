; esc_pause_menu.ini -- ESC pause menu configuration.
; All values are read once at load.

[Mod]
; 1 = replace vanilla ESC (abandon race) with the pause menu.
Enabled=1

[Retire]
; Max milliseconds to wait for the game to consume the retirement request.
; The proven value from pit_commentary.c is 900.
HoldMaxMs=900
; How long the mini/full restart flags stay pinned after the retirement
; lands, guarding against the SessionSynchronizer re-grid race. 2500.
GuardMs=2500
