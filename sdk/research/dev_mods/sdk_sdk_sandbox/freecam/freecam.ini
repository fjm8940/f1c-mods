[Mod]
Enabled=1

[FreeCam]
; Toggle key: F (0x46). Virtual-key code (see Windows VK_* values).
ToggleKey=70
; Movement speed in m/s while freecam is active.
MoveSpeed=15
; Sprint multiplier while holding Shift.
SprintFactor=4
; Slow multiplier while holding Ctrl.
SlowFactor=25
; Look speed (rad/s) for numpad 4/6 (yaw) and 8/2 (pitch).
YawSpeed=18
PitchSpeed=14
; Height above the player car the camera spawns at on toggle.
SpawnHeight=3
; 1 = mouse drives yaw/pitch while freecam is active (cursor is
; re-centered to the screen middle every frame).
MouseLook=1
; Mouse sensitivity: radians per pixel, stored scaled by 100000.
MouseSens=250
; Mouse smoothing: EMA time constant in milliseconds over the per-frame
; delta sums (0 = raw/unsmoothed). 30 ms kills event-batching jitter.
MouseSmooth=30
; 1 = zero the player car's throttle/steering/brake every frame while
; freecam is active (post-writer hook on AIMainUpdate 0x00424E70), so the
; car cannot be driven or AI-driven away while you fly the camera.
BlockCarInput=1
; Log one camera call every N calls to freecam_log.txt (0 = off).
LogEvery=30
