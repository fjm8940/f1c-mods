[Mod]
Enabled=1
; VK_NUMPAD0 = 0x60. Manual proof-of-concept trigger: press to swap the
; first adjacent AI teammate pair found this tick.
HotkeyVK=96
; How much slower the leading teammate is capped, in m/s, while yielding.
SpeedHandicapMps=8
; Give up and release the cap if the swap has not completed by this timeout.
SwapTimeoutMs=20000
PollMs=100
; Automatic trigger is OFF by default: it can only proxy "should swap" from
; the current in-race gap near the end of the race, not real championship
; standings (not extracted in this corpus yet). Enable only if that proxy is
; acceptable for your use.
AutoEnabled=0
AutoLapsFromEnd=3
; After the pass completes, hold the demoted driver AT the promoted driver's
; own live pace (never above it) for this many seconds, so he cannot
; immediately re-overtake. 0 disables the hold and releases him right away.
SwapCooldownS=15
