[Mod]
Enabled=1

; ------------------------------------------------------------------
; Fuel-fire lab configuration.
; The file is re-read every 100 ms while the game runs, so you can
; edit it live: save, and the next frame uses the new values.
; Changes apply immediately to an ACTIVE fire (descriptor is
; rewritten per tick) - no rebuild, no track reload.
; ------------------------------------------------------------------

[Fire]
; % chance a pit stop rolls the fuel-fire failure (0 = off, 100 = always).
; 0 = fire is manual-only (F1/Num0 or the GUI FIRE ON button) - it will
; NEVER ignite automatically just because a car enters the pit box.
chance_pct=0
; how many seconds the fire burns before it goes out (0 = forever)
burn_seconds=25
; kill the engine while burning (1=yes) - car is dead at the box
engine_kill=1
; retire the player (DNF) when the burn ends (1=yes, 0=no)
dnf_after_burn=0

[Flame]
; 2026-08-08: retuned for realism - old defaults (scale 2.5, 5 anchors incl.
; 2 at cockpit height) rendered as one static ball hanging over the driver's
; head. Anchors moved low/rear (engine bay, fuel filler, sidepods - where a
; real fuel fire actually starts); scale down + burst count up gives many
; small licking flames instead of one big blob; Power/RampSpeed multipliers
; are new - they drive the reaction's own animation speed, which vanilla
; never touches, so the flame now visibly flickers instead of sitting still.
;
; multiplier on the terrain.ini flames Scale (vanilla 0.40 -> ~0.54 at x1.35)
scale_mult=1.35
; multiplier on the terrain.ini flames Growth (vanilla 1.5) - higher = each
; particle grows and dies faster, which reads as livelier fire, not bigger
growth_mult=2.2
; particle rate 0..1 (scales particle SIZE, per ParticleTrailEmitter)
rate=0.55
; emission calls per tick (density; more + smaller = licking, not a blob)
bursts=10
; black smoke emission 0..1 (0 = no smoke column)
blacksmoke=0.0
; exhaust-flame bank (0 = off; positive = flames even at standstill)
bank3=0.90
; flame color ARGB hex (0x00000000 = leave terrain.ini color)
; presets: 0xFFD24A1A fuel-fire orange, 0xFFE8C020 yellow,
;          0xFFFFFFFF white-hot, 0xFFFF3020 red
color=0xFFD24A1A
; particle pool cap (vanilla Max=256; a big blaze needs more)
max=2048
; animation-speed multipliers on the reaction descriptor's own Power/
; RampSpeed fields (desc+68/+72) - vanilla never writes these, so a scaled
; flame still moved at the same slow rate. Raise for faster flicker.
power_mult=2.0
rampspeed_mult=2.5
; spilled-fuel ground pool: 24 points seeded at ignition around the car,
; revealed outward over time so the fire visibly spreads instead of staying
; pinned to the engine anchors. World-space, fixed at the ignition spot -
; does not follow the car if it moves.
; how fast the pool front expands, metres/second
spread_rate=0.55
; final radius of the fuel pool, metres
spread_max_radius=3.5
; on-car spread: 13 body anchors (engine bay -> sidepods -> cockpit flanks
; -> nose) light up rear-to-front over ~4.6s at rate 1.0. Raise to have the
; whole car catch fire faster; lower to keep it rear-contained longer.
car_spread_rate=1.0
