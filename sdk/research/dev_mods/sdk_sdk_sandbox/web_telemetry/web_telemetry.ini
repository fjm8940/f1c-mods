[Mod]
; Not used: nothing reads this key. Turn Telemetry on or off with the Lightloader Mods list switch.
Enabled=1
; Web page port. Open http://127.0.0.1:8080/ while the game runs. Default 8080.
Port=8080
; 1 = other devices (LAN / Tailscale) can open the page; also set BindAddress. 0 = this PC only (default).
Remote=0
; For Remote: this PC's private address, e.g. 192.0.2.10 or Tailscale 100.x. Empty = this PC only.
BindAddress=
; Recordings size limit (MB). Oldest sessions are removed past it. 0 = keep all. Default 3000.
MaxStorageMB=3000

[Director]
; TV Director: 1 = the TV Director tab may change the TV camera from this PC. 0 = view only (default).
Enabled=0
; TV Director car switch: 1 = a Cut may jump to another car. Needs Enabled=1 above. 0 = off (default).
CarSwitch=0
; 1 = no "camera switched to driver" commentary when the TV Director changes car (default). 0 = play it.
MuteCarChangeCommentary=1
; 1 = hide the HUD on cinematic cameras, show it on cockpit cameras (default). 0 = never touch the HUD.
HideHudOnCinematic=1
